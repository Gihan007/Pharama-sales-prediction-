<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#334155"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/></filter>
<style>
.title{font:700 36px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 18px Arial,sans-serif;fill:#475569}
.h{font:700 20px Arial,sans-serif;fill:#0f172a}.b{font:400 16px Arial,sans-serif;fill:#334155}.s{font:400 14px Arial,sans-serif;fill:#475569}
.metric{font:700 26px Arial,sans-serif;fill:#0f172a}.tiny{font:400 12px Arial,sans-serif;fill:#64748b}
.card{filter:url(#shadow)}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
</style>
</defs>
<rect width="1600" height="900" fill="#f8fafc"/>
<text x="800.0" y="58" text-anchor="middle" class="title">Proposed Drug Sales Prediction System Workflow</text>
<text x="800.0" y="90" text-anchor="middle" class="subtitle">User request to forecast output, visualization, and explanation</text>
<line x1="150" y1="150" x2="150" y2="770" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
<text x="150" y="130" text-anchor="middle" class="h">User</text>
<line x1="360" y1="150" x2="360" y2="770" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
<text x="360" y="130" text-anchor="middle" class="h">Frontend</text>
<line x1="590" y1="150" x2="590" y2="770" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
<text x="590" y="130" text-anchor="middle" class="h">API Gateway</text>
<line x1="840" y1="150" x2="840" y2="770" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
<text x="840" y="130" text-anchor="middle" class="h">Forecast Service</text>
<line x1="1085" y1="150" x2="1085" y2="770" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
<text x="1085" y="130" text-anchor="middle" class="h">Model Store</text>
<line x1="1310" y1="150" x2="1310" y2="770" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
<text x="1310" y="130" text-anchor="middle" class="h">Output</text>
<rect x="50" y="174" width="200" height="72" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="card"/>
<text x="150" y="202" text-anchor="middle" class="b">Select C1-C8, date,</text>
<text x="150" y="222" text-anchor="middle" class="b">model</text>
<rect x="260" y="249" width="200" height="72" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2" class="card"/>
<text x="360" y="277" text-anchor="middle" class="b">Submit forecast form</text>
<rect x="490" y="324" width="200" height="72" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="card"/>
<text x="590" y="352" text-anchor="middle" class="b">POST /api/forecast</text>
<rect x="740" y="399" width="200" height="72" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="card"/>
<text x="840" y="427" text-anchor="middle" class="b">Historical lookup or</text>
<text x="840" y="447" text-anchor="middle" class="b">future forecast</text>
<rect x="985" y="474" width="200" height="72" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" class="card"/>
<text x="1085" y="502" text-anchor="middle" class="b">Load model and scaler</text>
<text x="1085" y="522" text-anchor="middle" class="b">artifacts</text>
<rect x="740" y="549" width="200" height="72" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="card"/>
<text x="840" y="577" text-anchor="middle" class="b">Generate prediction</text>
<text x="840" y="597" text-anchor="middle" class="b">and chart</text>
<rect x="1210" y="624" width="200" height="72" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2" class="card"/>
<text x="1310" y="652" text-anchor="middle" class="b">Sales value, plot,</text>
<text x="1310" y="672" text-anchor="middle" class="b">model used</text>
<path class="arrow" d="M250 210 L260 285"/>
<path class="arrow" d="M460 285 L490 360"/>
<path class="arrow" d="M690 360 L740 435"/>
<path class="arrow" d="M940 435 L985 510"/>
<path class="arrow" d="M1185 510 L740 585"/>
<path class="arrow" d="M940 585 L1210 660"/>
<path class="dash" d="M1310 696 C1160 780 520 780 360 322"/>
<text x="780" y="810" text-anchor="middle" class="s">Returned result is rendered in the web interface with forecast plot and explanation output</text>
</svg>