<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#334155"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/></filter>
<style>
.title{font:700 36px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 18px Arial,sans-serif;fill:#475569}
.h{font:700 20px Arial,sans-serif;fill:#0f172a}.b{font:400 16px Arial,sans-serif;fill:#334155}.s{font:400 14px Arial,sans-serif;fill:#475569}
.metric{font:700 26px Arial,sans-serif;fill:#0f172a}.tiny{font:400 12px Arial,sans-serif;fill:#64748b}
.card{filter:url(#shadow)}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
</style>
</defs>
<rect width="1600" height="900" fill="#f8fafc"/>
<text x="800.0" y="58" text-anchor="middle" class="title">Explainability Workflow for Forecasting Outputs</text>
<text x="800.0" y="90" text-anchor="middle" class="subtitle">SHAP and fallback feature importance used to interpret lag contributions</text>
<rect x="90" y="350" width="250" height="120" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="card"/>
<text x="215.0" y="386" text-anchor="middle" class="h">Forecast Output</text>
<text x="215.0" y="418" text-anchor="middle" class="b">category, model, predicted</text>
<text x="215.0" y="439" text-anchor="middle" class="b">sales value</text>
<rect x="450" y="220" width="280" height="120" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="card"/>
<text x="590.0" y="256" text-anchor="middle" class="h">SHAP Available?</text>
<text x="590.0" y="288" text-anchor="middle" class="b">attempt model</text>
<text x="590.0" y="309" text-anchor="middle" class="b">explainability for</text>
<text x="590.0" y="330" text-anchor="middle" class="b">XGBoost/LightGBM</text>
<rect x="860" y="150" width="280" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="card"/>
<text x="1000.0" y="186" text-anchor="middle" class="h">SHAP Explanation</text>
<text x="1000.0" y="218" text-anchor="middle" class="b">feature contribution and</text>
<text x="1000.0" y="239" text-anchor="middle" class="b">summary plots</text>
<rect x="860" y="430" width="280" height="120" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="2" class="card"/>
<text x="1000.0" y="466" text-anchor="middle" class="h">Fallback Importance</text>
<text x="1000.0" y="498" text-anchor="middle" class="b">model feature importance</text>
<text x="1000.0" y="519" text-anchor="middle" class="b">or correlation-based lag</text>
<text x="1000.0" y="540" text-anchor="middle" class="b">importance</text>
<rect x="1250" y="290" width="260" height="140" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" class="card"/>
<text x="1380.0" y="326" text-anchor="middle" class="h">User Explanation</text>
<text x="1380.0" y="358" text-anchor="middle" class="b">lag contribution,</text>
<text x="1380.0" y="379" text-anchor="middle" class="b">important features,</text>
<text x="1380.0" y="400" text-anchor="middle" class="b">reasoning support</text>
<path class="arrow" d="M340 410 L450 280"/>
<path class="arrow" d="M730 280 C780 210 815 210 860 210"/>
<text x="805" y="205" text-anchor="middle" class="s">Yes</text>
<path class="arrow" d="M730 280 C770 420 815 485 860 490"/>
<text x="805" y="462" text-anchor="middle" class="s">No</text>
<path class="arrow" d="M1140 210 C1210 225 1220 305 1250 330"/>
<path class="arrow" d="M1140 490 C1210 470 1220 405 1250 370"/>
</svg>