apiVersion: apps/v1
kind: Deployment
metadata:
  name: explainability-service
  namespace: drug-sales
  labels:
    app: explainability-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: explainability-service
  template:
    metadata:
      labels:
        app: explainability-service
    spec:
      containers:
        - name: explainability-service
          image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/drug-sales-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args:
            - "services.explainability_service.app.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "5004"
          envFrom:
            - configMapRef:
                name: drug-sales-config
            - secretRef:
                name: drug-sales-secrets
          ports:
            - containerPort: 5004
          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
