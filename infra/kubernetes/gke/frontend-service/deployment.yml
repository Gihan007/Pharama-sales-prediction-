apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: drug-sales
  labels:
    app: frontend-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
        - name: frontend-service
          image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/drug-sales-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args:
            - "services.frontend_service.app.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "3001"
          envFrom:
            - configMapRef:
                name: drug-sales-config
            - secretRef:
                name: drug-sales-secrets
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
