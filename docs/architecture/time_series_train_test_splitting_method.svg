<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .label { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 17px Arial, sans-serif; fill: #334155; }
      .small { font: 400 15px Arial, sans-serif; fill: #475569; }
      .tiny { font: 400 13px Arial, sans-serif; fill: #64748b; }
      .metric { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .card { rx: 18; filter: url(#softShadow); }
      .tick { stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1500" height="760" fill="#f8fafc"/>

  <text x="750" y="60" text-anchor="middle" class="title">Time-Series Train-Test Splitting Method</text>
  <text x="750" y="94" text-anchor="middle" class="subtitle">Chronological split used for category-wise pharmaceutical sales forecasting evaluation</text>

  <rect x="80" y="135" width="1340" height="108" class="card" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>
  <text x="135" y="178" class="label">Project dataset</text>
  <text x="135" y="212" class="text">C1-C8 weekly sales records, 517 observations per category</text>
  <text x="945" y="178" class="label">Full date range</text>
  <text x="945" y="212" class="text">2014-01-12 to 2023-12-03</text>

  <text x="120" y="302" class="small">Earlier historical records</text>
  <text x="1255" y="302" class="small">Latest records</text>

  <rect x="120" y="330" width="1095" height="82" rx="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
  <rect x="1215" y="330" width="165" height="82" rx="14" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
  <line x1="1215" y1="318" x2="1215" y2="430" stroke="#0f172a" stroke-width="4" stroke-dasharray="10 8"/>

  <text x="668" y="364" text-anchor="middle" class="metric">Training / Model Learning Period</text>
  <text x="668" y="392" text-anchor="middle" class="text">507 weekly records per category</text>

  <text x="1298" y="364" text-anchor="middle" class="metric">Test</text>
  <text x="1298" y="392" text-anchor="middle" class="text">10 weeks</text>

  <line x1="120" y1="455" x2="1380" y2="455" stroke="#94a3b8" stroke-width="3"/>
  <line x1="120" y1="444" x2="120" y2="466" class="tick"/>
  <line x1="1215" y1="444" x2="1215" y2="466" class="tick"/>
  <line x1="1380" y1="444" x2="1380" y2="466" class="tick"/>

  <text x="120" y="492" text-anchor="middle" class="small">2014-01-12</text>
  <text x="1215" y="492" text-anchor="middle" class="small">2023-09-24</text>
  <text x="1380" y="492" text-anchor="middle" class="small">2023-12-03</text>
  <text x="1298" y="520" text-anchor="middle" class="tiny">Test window: 2023-10-01 to 2023-12-03</text>

  <rect x="95" y="565" width="390" height="118" class="card" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="130" y="606" class="label">Why chronological?</text>
  <text x="130" y="638" class="text">Past sales should predict future sales.</text>
  <text x="130" y="664" class="text">Random splitting would leak future patterns.</text>

  <rect x="555" y="565" width="390" height="118" class="card" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="590" y="606" class="label">Evaluation target</text>
  <text x="590" y="638" class="text">Compare predictions against final 10 weeks.</text>
  <text x="590" y="664" class="text">Metrics: MAE, RMSE, MAPE, inference time.</text>

  <rect x="1015" y="565" width="390" height="118" class="card" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="1050" y="606" class="label">Applied per category</text>
  <text x="1050" y="638" class="text">The same split logic is used for C1-C8.</text>
  <text x="1050" y="664" class="text">Each drug category is evaluated separately.</text>

  <text x="750" y="724" text-anchor="middle" class="tiny">Figure: Time-series train-test splitting method used in the implemented drug sales forecasting project</text>
</svg>
