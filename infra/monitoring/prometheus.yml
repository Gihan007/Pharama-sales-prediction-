global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Drug Sales Prediction services
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:5000']
    scrape_interval: 5s
    metrics_path: '/metrics'

  - job_name: 'forecast-service'
    static_configs:
      - targets: ['forecast-service:5001']
    scrape_interval: 5s
    metrics_path: '/metrics'

  - job_name: 'training-service'
    static_configs:
      - targets: ['training-service:5002']
    scrape_interval: 15s
    metrics_path: '/metrics'

  - job_name: 'advanced-ai-service'
    static_configs:
      - targets: ['advanced-ai-service:5003']
    scrape_interval: 15s
    metrics_path: '/metrics'

  - job_name: 'explainability-service'
    static_configs:
      - targets: ['explainability-service:5004']
    scrape_interval: 15s
    metrics_path: '/metrics'

  # Redis cache
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # PostgreSQL database (if used)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
