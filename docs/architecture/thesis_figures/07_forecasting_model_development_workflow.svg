<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#334155"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/></filter>
<style>
.title{font:700 36px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 18px Arial,sans-serif;fill:#475569}
.h{font:700 20px Arial,sans-serif;fill:#0f172a}.b{font:400 16px Arial,sans-serif;fill:#334155}.s{font:400 14px Arial,sans-serif;fill:#475569}
.metric{font:700 26px Arial,sans-serif;fill:#0f172a}.tiny{font:400 12px Arial,sans-serif;fill:#64748b}
.card{filter:url(#shadow)}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
</style>
</defs>
<rect width="1600" height="900" fill="#f8fafc"/>
<text x="800.0" y="58" text-anchor="middle" class="title">Forecasting Model Development Workflow</text>
<text x="800.0" y="90" text-anchor="middle" class="subtitle">Comparative model families trained and evaluated in the project</text>
<rect x="90" y="380" width="230" height="120" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2" class="card"/>
<text x="205.0" y="416" text-anchor="middle" class="h">Prepared Dataset</text>
<text x="205.0" y="448" text-anchor="middle" class="b">category-wise time-series</text>
<text x="205.0" y="469" text-anchor="middle" class="b">data</text>
<rect x="430" y="165" width="270" height="125" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="card"/>
<text x="565.0" y="201" text-anchor="middle" class="h">Statistical</text>
<text x="565.0" y="233" text-anchor="middle" class="b">SARIMAX, Prophet</text>
<rect x="430" y="340" width="270" height="125" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2" class="card"/>
<text x="565.0" y="376" text-anchor="middle" class="h">Machine Learning</text>
<text x="565.0" y="408" text-anchor="middle" class="b">XGBoost, LightGBM with lag</text>
<text x="565.0" y="429" text-anchor="middle" class="b">features</text>
<rect x="430" y="515" width="270" height="125" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" class="card"/>
<text x="565.0" y="551" text-anchor="middle" class="h">Deep Learning</text>
<text x="565.0" y="583" text-anchor="middle" class="b">LSTM, GRU, Transformer,</text>
<text x="565.0" y="604" text-anchor="middle" class="b">TFT, N-BEATS, Informer</text>
<rect x="790" y="340" width="270" height="125" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="2" class="card"/>
<text x="925.0" y="376" text-anchor="middle" class="h">Ensemble</text>
<text x="925.0" y="408" text-anchor="middle" class="b">weighted and performance-</text>
<text x="925.0" y="429" text-anchor="middle" class="b">weighted combination</text>
<rect x="1130" y="340" width="270" height="125" rx="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="2" class="card"/>
<text x="1265.0" y="376" text-anchor="middle" class="h">Evaluation</text>
<text x="1265.0" y="408" text-anchor="middle" class="b">MAE, RMSE, MAPE, inference</text>
<text x="1265.0" y="429" text-anchor="middle" class="b">time</text>
<path class="arrow" d="M320 440 L430 227"/>
<path class="arrow" d="M320 440 L430 402"/>
<path class="arrow" d="M320 440 L430 577"/>
<path class="arrow" d="M700 227 L790 402"/>
<path class="arrow" d="M700 402 L790 402"/>
<path class="arrow" d="M700 577 L790 402"/>
<path class="arrow" d="M1060 402 L1130 402"/>
<text x="800" y="730" text-anchor="middle" class="s">The workflow compares model families instead of depending on a single forecasting method.</text>
</svg>