<text x="255" y="525" text-anchor="end" class="h">N05B</text>
<text x="150" y="558" text-anchor="middle" class="h">Anxiolytics</text>
<text x="150" y="588" text-anchor="middle" class="s">Diazepam, Lorazepam</text>
<path class="dash" d="M800 240 C800 380 465 380 465 485"/>
