<text x="985" y="183" text-anchor="middle" class="h">Analgesics</text>
<text x="985" y="213" text-anchor="middle" class="s">Aspirin</text>
<path class="dash" d="M800 240 C800 380 1300 380 1300 110"/>
<rect x="1165" y="113" width="270" height="144" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" class="card"/>
