<text x="570" y="150" text-anchor="end" class="h">M01AE</text>
<text x="465" y="183" text-anchor="middle" class="h">Anti-inflammatory</text>
<text x="465" y="213" text-anchor="middle" class="s">Ibuprofen, Naproxen</text>
