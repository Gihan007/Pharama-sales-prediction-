<text x="1090" y="525" text-anchor="end" class="h">R03</text>
<text x="985" y="558" text-anchor="middle" class="h">Obstructive airway drugs</text>
<text x="985" y="588" text-anchor="middle" class="s">Salbutamol, Beclometasone</text>
<path class="dash" d="M800 240 C800 380 1300 380 1300 485"/>
<rect x="1165" y="488" width="270" height="144" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" class="card"/>
